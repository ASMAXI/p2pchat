<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drift — открыть приглашение</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12161a;
        --fg: #f5f0df;
        --muted: #9aa3a8;
        --accent: #d8fa67;
        --card: #1c2329;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at 20% 10%, #243038, var(--bg) 55%);
        color: var(--fg);
      }
      main {
        width: min(440px, 100%);
        background: #1c2329;
        border: 1px solid #2e3942;
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.55rem;
        letter-spacing: -0.04em;
      }
      p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; font-size: 0.95rem; }
      a.btn, button.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        background: var(--accent);
        color: #12161a;
        font-size: 1rem;
      }
      button.secondary, a.secondary {
        background: transparent;
        color: var(--fg);
        border: 1px solid #3a4650;
      }
      code {
        display: block;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #0d1114;
        color: #c9d1d9;
        font-size: 0.72rem;
        word-break: break-all;
      }
      .ok { color: var(--accent); }
      .err { color: #f28262; }
      .steps { margin: 12px 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <h1>Drift</h1>
      <p id="status">Нажмите кнопку, чтобы открыть приложение с приглашением.</p>
      <a class="btn" id="open" href="#">Открыть Drift</a>
      <button class="btn secondary" id="copy" type="button">Скопировать drift:// ссылку</button>
      <ol class="steps">
        <li>Должен быть установлен Drift (Windows).</li>
        <li>Если браузер спросит — разрешите открыть приложение.</li>
        <li>Нет Drift — установите и нажмите кнопку снова.</li>
      </ol>
      <code id="deep"></code>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var payload = (params.get("d") || params.get("payload") || "").trim();
        if (!payload && location.hash) {
          payload = location.hash.replace(/^#/, "").replace(/^d=/i, "").trim();
        }
        var status = document.getElementById("status");
        var openBtn = document.getElementById("open");
        var copyBtn = document.getElementById("copy");
        var deepEl = document.getElementById("deep");

        if (!payload) {
          status.className = "err";
          status.textContent = "В ссылке нет приглашения. Попросите свежую ссылку из Drift.";
          openBtn.style.display = "none";
          copyBtn.style.display = "none";
          return;
        }

        var deep = "drift://j/" + decodeURIComponent(payload);
        deepEl.textContent = deep;
        openBtn.href = deep;

        function launch(fromUser) {
          status.className = "ok";
          status.textContent = fromUser
            ? "Запускаем Drift… Разрешите открытие приложения, если браузер спросит."
            : "Пробуем открыть Drift… Если не вышло — нажмите зелёную кнопку.";
          try {
            var iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = deep;
            document.body.appendChild(iframe);
            setTimeout(function () {
              try { document.body.removeChild(iframe); } catch (e) {}
            }, 1500);
          } catch (e) {}
          // Keep page alive; full navigation away often fails silently when scheme is blocked.
          try {
            window.location.href = deep;
          } catch (e2) {}
        }

        openBtn.addEventListener("click", function (event) {
          // Keep default <a href="drift://…"> navigation; also kick iframe fallback.
          launch(true);
        });

        copyBtn.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(deep).then(
              function () {
                status.className = "ok";
                status.textContent = "Ссылка drift:// скопирована — вставьте в Drift вручную";
              },
              function () {
                status.textContent = "Не удалось скопировать — выделите код ниже";
              },
            );
          } else {
            status.textContent = "Выделите код ниже и скопируйте вручную";
          }
        });

        // Soft auto-try (many browsers block this without a click — button is the real path).
        setTimeout(function () { launch(false); }, 250);
      })();
    </script>
  </body>
</html>
