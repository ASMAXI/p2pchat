name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run typecheck

  rust:
    name: Cargo test and clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/p2pchat/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: artifacts/p2pchat/src-tauri
      - name: Cargo test
        run: cargo test --lib
      - name: Cargo clippy
        run: cargo clippy --lib -- -D warnings
