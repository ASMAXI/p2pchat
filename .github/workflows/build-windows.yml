name: Build P2PChat for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "p2pchat-v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        working-directory: artifacts/p2pchat
        run: pnpm desktop:build:windows

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: p2pchat-windows-x64
          if-no-files-found: error
          path: |
            artifacts/p2pchat/src-tauri/target/release/bundle/nsis/*.exe
            artifacts/p2pchat/src-tauri/target/release/bundle/msi/*.msi
